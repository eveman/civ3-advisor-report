<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSA — интерактивная карта v1.0</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101a29;color:#dce9f6;font:14px Segoe UI,Arial}
header{padding:13px 18px;background:#18283e;border-bottom:1px solid #40516a;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
a{color:#89c9ff}#stats{color:#bad1e7}#wrap{height:calc(100vh - 110px);min-height:300px;position:relative;overflow:hidden;touch-action:none}
canvas{width:100%;height:100%;display:block;cursor:grab}canvas:active{cursor:grabbing}#tip{padding:9px 16px;color:#abc6df;background:#17263a;min-height:39px}
button{background:#263f59;border:1px solid #546b83;color:white;border-radius:5px;padding:5px 10px;cursor:pointer}
</style></head><body>
<header><b>Civ3 Strategic Advisor — карта</b><a href="index.html">Главная</a><div id="stats">Загрузка...</div>
<button id="fit">Вписать карту</button><small>Колесо: масштаб · Перетаскивание: перемещение · Наведи для данных тайла</small></header>
<div id="wrap"><canvas id="map"></canvas></div><div id="tip">Данные о ресурсах пока не декодируются. Цвета показывают сырые категории рельефа, без их названий.</div>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),tip=document.querySelector('#tip'),stats=document.querySelector('#stats');
const colors=['#567c43','#b59c55','#598b9d','#7f8e63','#a58a58','#727d7d','#627e58','#ab9e72','#667f9b','#a57b69','#676e94','#7e936c','#9a8475','#74949b'];
let data=null,scale=1,px=0,py=0,pressed=false,lastX=0,lastY=0,tiles=[],cities=[],workers=[];const tw=20,th=13;
function world(t){return [20+t.x*tw/2,20+t.y*th/2]}
function fit(){if(!data)return;const W=20+data.width*tw/2,H=20+data.height*th/2;scale=Math.min(canvas.clientWidth/W,canvas.clientHeight/H)*.94;scale=Math.max(.10,scale);px=(canvas.clientWidth-W*scale)/2;py=(canvas.clientHeight-H*scale)/2;draw()}
function draw(){const dpr=window.devicePixelRatio||1,W=canvas.clientWidth,H=canvas.clientHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle='#0c1421';ctx.fillRect(0,0,W,H);if(!data)return;ctx.save();ctx.translate(px,py);ctx.scale(scale,scale);
for(const t of tiles){const [x,y]=world(t);if((x+tw)*scale+px<0||(x-tw)*scale+px>W||(y+th)*scale+py<0||(y-th)*scale+py>H)continue;
ctx.fillStyle=colors[(t.terrain%colors.length+colors.length)%colors.length];ctx.globalAlpha=t.visible?1:.49;ctx.beginPath();ctx.moveTo(x,y-th/2);ctx.lineTo(x+tw/2,y);ctx.lineTo(x,y+th/2);ctx.lineTo(x-tw/2,y);ctx.closePath();ctx.fill();}
ctx.globalAlpha=1;for(const c of cities){const [x,y]=world(c);ctx.fillStyle='#ffd65d';ctx.strokeStyle='#101010';ctx.lineWidth=1.2;ctx.fillRect(x-3,y-3,6,6);ctx.strokeRect(x-3,y-3,6,6);if(scale>.48){ctx.font='bold 10px Segoe UI';ctx.fillStyle='white';ctx.fillText(c.name,x+6,y-4)}}
for(const w of workers){const [x,y]=world(w);ctx.beginPath();ctx.fillStyle='#f17aa3';ctx.arc(x,y,2.7,0,Math.PI*2);ctx.fill()}ctx.restore()}
function nearest(X,Y){if(!data)return null;const x=(X-px)/scale,y=(Y-py)/scale;let best=null,dist=1e20;
for(const t of tiles){const [a,b]=world(t);const v=((a-x)/tw)**2+((b-y)/th)**2;if(v<dist){dist=v;best=t}}return dist<.45?best:null}
canvas.addEventListener('pointerdown',e=>{pressed=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointerup',()=>pressed=false);canvas.addEventListener('pointercancel',()=>pressed=false);
canvas.addEventListener('pointermove',e=>{if(pressed){px+=e.clientX-lastX;py+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;draw();return}
const r=canvas.getBoundingClientRect(),t=nearest(e.clientX-r.left,e.clientY-r.top);tip.textContent=t?`Тайл (${t.x}, ${t.y}) · Рельеф ID ${t.terrain} · Виден сейчас: ${t.visible?'да':'нет'} · Владелец ${t.owner} · Улучшения (сырой битовый код) ${t.improvements} · Река ${t.river}`:'Нет данных (неразведанная территория)';});
canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,f=Math.exp(-e.deltaY*.001);const old=scale;scale=Math.max(.05,Math.min(10,scale*f));px=x-(x-px)*scale/old;py=y-(y-py)*scale/old;draw()},{passive:false});
window.addEventListener('resize',draw);document.querySelector('#fit').addEventListener('click',fit);
fetch('map.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(j=>{data=j;tiles=j.tiles||[];cities=j.cities||[];workers=j.workers||[];stats.textContent=`${j.width}×${j.height} | исследовано ${j.explored} из ${j.total_tiles} | видно ${j.visible_now} | городов ${cities.length} | рабочих ${workers.length}`;fit()}).catch(e=>{stats.textContent='Не удалось загрузить map.json: '+e.message});
</script></body></html>
