<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Civ3 Strategic Advisor</title>
<style>
body{background:#0d1422;color:#e8f0fa;font:15px Segoe UI,Arial,sans-serif;
max-width:1100px;margin:30px auto;padding:0 18px}
h1,h2{color:#93caff}
.stats{background:#1b2b42;border-radius:10px;padding:17px;line-height:2}
table{border-collapse:collapse;width:100%;margin:15px 0 35px}
th,td{padding:8px;text-align:left;border-bottom:1px solid #35445a}
th{color:#98cfff}
small{color:#9eafc5}
a{color:#98cfff}
</style>
</head>
<body>
<h1>Civ3 Strategic Advisor</h1>
<div class="stats" id="stats">Loading latest game state...</div>
<h2>Military</h2>
<table>
<thead><tr><th>Unit type ID</th><th>Count</th></tr></thead>
<tbody id="units"></tbody>
</table>
<h2>Cities</h2>
<table>
<thead><tr>
<th>City</th><th>Pop</th><th>Specialists</th>
<th>Food</th><th>Shields</th><th>Maintenance</th><th>Building</th>
</tr></thead>
<tbody id="cities"></tbody>
</table>
<small>
Food and shields are accumulated stocks.
Unit and production IDs are not yet decoded into names.
Some fields require in-game validation.
</small>
<p><a href="state.json">Raw JSON</a></p>
<script>
function populate(id, rows) {
    const body = document.getElementById(id);
    body.replaceChildren();
    for (const values of rows) {
        const tr = document.createElement("tr");
        for (const value of values) {
            const td = document.createElement("td");
            td.textContent = String(value ?? "");
            tr.appendChild(td);
        }
        body.appendChild(tr);
    }
}
async function update() {
    try {
        const response = await fetch(
            "state.json?t=" + Date.now(),
            {cache:"no-store"}
        );
        if (!response.ok) throw Error("HTTP " + response.status);
        const s = await response.json();

        document.getElementById("stats").textContent =
            "Year: " + s.game_year +
            " | Cities: " + s.city_count +
            " | Population: " + s.total_population +
            " | Units: " + s.owned_units +
            " | Maintenance: " + s.city_maintenance +
            " | Updated: " + s.updated_utc;

        populate("units", (s.units || []).map(u => [
            u.type_id, u.count
        ]));
        populate("cities", (s.cities || []).map(c => [
            c.name, c.population, c.specialists,
            c.food_stored, c.shields_stored, c.maintenance,
            c.production_type + "/" + c.production_id
        ]));
    } catch (error) {
        document.getElementById("stats").textContent =
            "Cannot load state.json: " + error.message;
    }
}
update();
setInterval(update, 30000);
</script>
</body>
</html>
